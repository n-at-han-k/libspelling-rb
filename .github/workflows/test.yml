# Runs the suite in the same dev shell a developer gets.
#
# This gem is pure Ruby, so there is nothing to cross-compile and no
# per-platform matrix -- the cross-compile workflow this replaced existed for a
# Rust extension that is gone. What the suite does need is Spelling-1.typelib,
# the typelibs it names, and the glib they were built against: get those from
# two different places and GIO is registered twice in one process, which fails
# as `cannot register existing type 'GTlsCertificate'`.
#
# flake.nix pins all of that and builds GI_TYPELIB_PATH, so CI runs through
# `nix develop` rather than installing apt packages and gems and hoping the
# versions line up. That is deliberate: the environment is the hard part of a
# GI binding, and CI checking a different one than people develop in is how an
# environment bug reaches a release.
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # The flake evaluates `self`, so the files have to be in git's index.
      # A checkout satisfies that; this is the guard for anything generated.
      - name: Check the tree is what the flake will see
        run: git status --porcelain

      # Headless, and that is part of the test: spelling_init needs no display,
      # so there is no xvfb here and there should never need to be one.
      - name: Run the suite
        run: nix develop --command bin/test

      # The gem must stay pure Ruby: no extension of its own, and no
      # resurrection of the Rust dependencies that were removed. Checked
      # against the built artefact rather than the working tree, because what
      # ships is what matters.
      - name: The packaged gem is pure Ruby
        run: |
          nix develop --command bash -c '
            set -euo pipefail
            gem build libspelling.gemspec
            contents=$(tar -xOf libspelling-*.gem data.tar.gz | tar -tzf -)
            echo "$contents"
            if echo "$contents" | grep -qE "(^|/)ext/|\.rs$|Cargo\.(toml|lock)"; then
              echo "::error::the packaged gem carries native-extension sources"; exit 1
            fi
            ruby -e "
              spec = Gem::Specification.load(\"libspelling.gemspec\")
              abort \"gemspec declares extensions: #{spec.extensions}\" unless spec.extensions.empty?
              names = spec.runtime_dependencies.map(&:name).sort
              abort \"unexpected runtime deps: #{names}\" unless names == [\"gem_kit\", \"gobject-introspection\"]
              puts \"packaged gem is pure Ruby; runtime deps: #{names.join(\", \")}\"
            "
          '

      # Install the built gem into an empty gem directory, rather than
      # asserting it would work. `--ignore-dependencies` is the point of the
      # step and not a dodge: it installs *this* gem alone, so anything
      # compiled, or any object written, is this gem's doing.
      #
      # `--install-dir` rather than GEM_HOME because the dev shell's ruby comes
      # from bundlerEnv, whose wrapper sets GEM_HOME itself and points it at
      # the read-only store; an install there fails on permissions and proves
      # nothing either way.
      #
      # This is deliberately not a full install with dependencies resolved,
      # because that would not show "no toolchain" and the README does not
      # claim it: glib2 and gobject-introspection declare spec.extensions and
      # build against glib, so installing them does compile C. What is true,
      # and what this step checks, is that libspelling adds no build step on
      # top of the two every ruby-gnome application already has.
      - name: The built gem installs with no build step
        run: |
          nix develop --command bash -c '
            set -euo pipefail
            home=$(mktemp -d)
            gem install --local --ignore-dependencies --no-document \
              --install-dir "$home" libspelling-*.gem
            find "$home" -type f | sort
            if find "$home" -type f | grep -qE "\.(so|bundle|dll|o|a)$"; then
              echo "::error::installing the gem produced a compiled object"; exit 1
            fi
            # RubyGems creates extensions/ whether or not anything is built, so
            # the check is that nothing landed in it.
            if [ -n "$(find "$home/extensions" -mindepth 1 2>/dev/null)" ]; then
              echo "::error::installing the gem built an extension"; exit 1
            fi
          '
